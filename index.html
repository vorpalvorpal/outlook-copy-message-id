<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Copy Message ID</title>
<script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
<script src="format.js"></script>
<style>
  :root { --fg: #1b1b1b; --muted: #5f5f5f; --bg: #fff; --box: #f3f3f3; --accent: #005eb8; --ok: #107c10; }
  @media (prefers-color-scheme: dark) {
    :root { --fg: #eee; --muted: #aaa; --bg: #1f1f1f; --box: #2b2b2b; --accent: #4ea1ff; --ok: #6ccb5f; }
  }
  body { margin: 0; padding: 12px; font: 14px/1.4 "Segoe UI", system-ui, sans-serif; color: var(--fg); background: var(--bg); }
  pre { white-space: pre-wrap; word-break: break-all; background: var(--box); padding: 8px; border-radius: 4px; font-size: 12px; }
  button { font: inherit; padding: 6px 14px; border: 0; border-radius: 4px; background: var(--accent); color: #fff; cursor: pointer; }
  #status { margin-left: 8px; color: var(--muted); }
  #status.ok { color: var(--ok); }
</style>
</head>
<body>
<button id="copy" disabled>Copy</button><span id="status">Loading…</span>
<pre id="text"></pre>
<script>
  const textEl = document.getElementById('text');
  const statusEl = document.getElementById('status');
  const button = document.getElementById('copy');

  function setStatus(message, ok) {
    statusEl.textContent = message;
    statusEl.className = ok ? 'ok' : '';
  }

  // navigator.clipboard can be refused inside Outlook's iframe, so fall back
  // to a selected textarea and execCommand.
  async function copy(text) {
    try {
      await navigator.clipboard.writeText(text);
      return true;
    } catch (_) {
      const area = document.createElement('textarea');
      area.value = text;
      document.body.appendChild(area);
      area.select();
      const done = document.execCommand('copy');
      area.remove();
      return done;
    }
  }

  async function copyCurrent() {
    const ok = await copy(textEl.textContent);
    setStatus(ok ? 'Copied' : 'Copy failed: select the text and copy it', ok);
  }

  // Called on open and, while the pane is pinned, whenever the selected
  // email changes. Only the first call follows a click, so only it can copy
  // without one.
  async function show(tryCopy) {
    const item = Office.context.mailbox.item;
    if (!item || !item.internetMessageId) {
      textEl.textContent = '';
      button.disabled = true;
      setStatus('Select a single email');
      return;
    }
    textEl.textContent = formatReference(item);
    button.disabled = false;
    if (tryCopy && await copy(textEl.textContent)) setStatus('Copied', true);
    else setStatus('Click to copy');
  }

  Office.onReady(() => {
    button.addEventListener('click', copyCurrent);
    Office.context.mailbox.addHandlerAsync(Office.EventType.ItemChanged, () => show(false));
    show(true);
  });
</script>
</body>
</html>
